spring.application.name=gateflow-control-service

server.port = 8081
info.app.name = Gateflow Control Service
info.app.description = Management service for users, routes and gateway policies

spring.datasource.url = jdbc:mysql://localhost:3306/gateflow_management
spring.datasource.username = root
spring.datasource.password = root

spring.jpa.hibernate.ddl-auto = validate
spring.flyway.enabled = true

security.jwt.expiration-seconds=3600
security.jwt.secret=gateflow-jwt-secret-key-atleast-length-of-256bits

gateway.kafka.configuration-topic=${GATEFLOW_CONFIGURATION_TOPIC:gateway-configuration-events}
spring.kafka.bootstrap-servers=${GATEFLOW_KAFKA_SERVERS:localhost:9092}