spring.application.name=gateflow-gateway-service

server.port = 8080
info.app.name = Gateflow Gateway Service
info.app.description = Custom API gateway for routing, security and traffic management

management.api.username=${GATEFlOW_GATEWAY_USERNAME:gateway-service}
management.api.password=${GATEFlOW_GATEWAY_PASSWORD:gateway123}
management.api.base-url=${GATEFlOW_MANAGEMENT_URL:http://localhost:8081}

gateway.kafka.configuration-topic=${GATEFlOW_CONFIGURATION_TOPIC:gateway-configuration-events}
gateway.kafka.configuration-group=${GATEFlOW_CONFIGURATION_GROUP:smart-gateway-configuration}
spring.kafka.bootstrap-servers=${GATEFlOW_KAFKA_SERVERS:localhost:9092}

spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer